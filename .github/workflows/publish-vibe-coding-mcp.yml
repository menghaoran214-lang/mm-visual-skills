name: Publish Vibe Coding MCP Registry
# Managed by ChatGPT for the Vibe Coding remote MCP listing.

on:
  push:
    paths:
      - ".mcp-registry/vibe-coding-cn/server.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Validate
        run: ./mcp-publisher validate .mcp-registry/vibe-coding-cn/server.json

      - name: Publish
        run: ./mcp-publisher publish .mcp-registry/vibe-coding-cn/server.json
